{% extends 'base.html' %}

{% block pageTitle %}تعديل بيانات معلم{% endblock %}

{% block content %}
<main class="container mt-5">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-4">تعديل بيانات {{ teacher.f_name }} {{ teacher.l_name }}</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">الاسم الأول</label>
                <input type="text" class="form-control" name="f_name" value="{{ teacher.f_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">الاسم الأخير</label>
                <input type="text" class="form-control" name="l_name" value="{{ teacher.l_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">العمر</label>
                <input type="number" class="form-control" name="age" value="{{ teacher.age }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">المستوى</label>
                <select class="form-select" name="level" required>
                    <option value="DR" {% if teacher.level=="DR" %}selected{% endif %}>DR</option>
                    <option value="PROF" {% if teacher.level=="PROF" %}selected{% endif %}>PROF</option>
                    <option value="MASTER" {% if teacher.level=="MASTER" %}selected{% endif %}>MASTER</option>
                    <option value="STU" {% if teacher.level=="STU" %}selected{% endif %}>STU</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">المادة</label>
                <input type="text" class="form-control" name="subject" value="{{ teacher.subject }}" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="status" id="status" {% if teacher.status %}checked{% endif %}>
                <label class="form-check-label" for="status">نشط</label>
            </div>
            <div class="mb-3">
                <label class="form-label">التقرير</label>
                <textarea class="form-control" name="report">{{ teacher.report }}</textarea>
            </div>
            <button type="submit" class="btn btn-warning">تحديث</button>
            <a href="{% url 'teachers:list' %}" class="btn btn-secondary">إلغاء</a>
        </form>
    </div>
</main>
{% endblock %}
